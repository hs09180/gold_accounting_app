name: Optional Capacitor Preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test accounting balance rules
        run: node --test accounting.test.cjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          if [ -f icon.svg ]; then cp icon.svg www/; fi
      - name: Install dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web app
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zarnigar-capacitor-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
