name: Build Zarnigar Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'icon.svg'
      - 'accounting.test.cjs'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Require persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing GitHub Actions secret KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing GitHub Actions secret KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing GitHub Actions secret KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing GitHub Actions secret KEY_PASSWORD" && exit 1)
          mkdir -p "$RUNNER_TEMP/zarnigar-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zarnigar-signing/release.jks"
          echo "ZARNIGAR_KEYSTORE_PATH=$RUNNER_TEMP/zarnigar-signing/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set up Node and test accounting rules
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run accounting and voice tests
        run: node --test accounting.test.cjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          tools: ''
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle web app for offline use
        run: |
          mkdir -p app/src/main/assets/www
          cp index.html manifest.json icon.svg app/src/main/assets/www/

      - name: Build APK with persistent signing
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zarnigar-android-stable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
